name: Build and publish go-bt package

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: sudo apt-get install -y dpkg-dev

      - name: Build .deb
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE=go-bt
          ARCH=all
          BUILD="${RUNNER_TEMP}/${PACKAGE}_${VERSION}_${ARCH}"
          DIST="${RUNNER_TEMP}/dist"

          mkdir -p "${BUILD}/DEBIAN" \
                   "${BUILD}/opt/gocontroll/go-bt" \
                   "${BUILD}/lib/systemd/system" \
                   "${DIST}"

          # --- Python package files -----------------------------------------------
          cp -r go_bt "${BUILD}/opt/gocontroll/go-bt/"
          find "${BUILD}/opt/gocontroll/go-bt" -name '__pycache__' -type d \
            -exec rm -rf {} + 2>/dev/null || true

          # --- Systemd service file -----------------------------------------------
          cat > "${BUILD}/lib/systemd/system/go-bt.service" << 'SERVICE'
          [Unit]
          Description=GOcontroll BLE GATT server
          After=bluetooth.target network.target

          [Service]
          Type=simple
          Environment=PYTHONPATH=/opt/gocontroll/go-bt
          ExecStart=/usr/bin/python3 -m go_bt
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          # --- postinst script ----------------------------------------------------
          cat > "${BUILD}/DEBIAN/postinst" << 'POSTINST'
          #!/bin/sh
          set -e
          systemctl daemon-reload
          systemctl enable go-bt.service
          systemctl restart go-bt.service || true
          POSTINST
          chmod 755 "${BUILD}/DEBIAN/postinst"

          # --- prerm script -------------------------------------------------------
          cat > "${BUILD}/DEBIAN/prerm" << 'PRERM'
          #!/bin/sh
          set -e
          systemctl stop go-bt.service || true
          systemctl disable go-bt.service || true
          PRERM
          chmod 755 "${BUILD}/DEBIAN/prerm"

          # --- DEBIAN/control file ------------------------------------------------
          cat > "${BUILD}/DEBIAN/control" << CONTROL
          Package: ${PACKAGE}
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: GOcontroll B.V. <info@gocontroll.com>
          Depends: python3 (>= 3.11), python3-dbus, python3-gi
          Section: utils
          Priority: optional
          Homepage: https://gocontroll.com
          Description: GOcontroll BLE GATT server
           BLE Low Energy GATT server for GOcontroll Linux controllers.
           Enables iOS/Android app monitoring and configuration over Bluetooth.
          CONTROL

          # --- Build .deb ---------------------------------------------------------
          dpkg-deb -Zxz --build --root-owner-group "${BUILD}" \
            "${DIST}/${PACKAGE}_${VERSION}_${ARCH}.deb"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/dist/go-bt_${{ steps.version.outputs.version }}_all.deb
          generate_release_notes: true

      - name: Trigger go-apt index rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.APT_DISPATCH_TOKEN }}
          repository: GOcontroll/go-apt
          event-type: rebuild-index
          client-payload: |
            {
              "package": "go-bt",
              "version": "${{ steps.version.outputs.version }}",
              "arch": "all",
              "deb_url": "https://github.com/GOcontroll/go-bt/releases/download/${{ github.ref_name }}/go-bt_${{ steps.version.outputs.version }}_all.deb"
            }
