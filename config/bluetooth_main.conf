# BlueZ main configuration for go-bt.
# Adapted from the Twilight-Flow / Stepper-Hat known-good config — see
# https://github.com/Rick-GO/GOcontroll-Stepper-Hat/blob/main/Raspberry%20BT%20server/twilight-flow-install/config/bluetooth_main.conf
#
# Key choices:
# - ControllerMode = le
#     Force the adapter into LE-only mode. Skips all BR/EDR (Classic) state
#     machinery — faster advertising start, fewer adapter reset paths, and
#     prevents cached Classic bonds from interfering with LE-only clients.
#
# - JustWorksRepairing = always
#     If a device pairs Just-Works (no PIN, no MITM) and reconnects later,
#     accept the new bond automatically. Without this, iOS' "Forget device"
#     dance is required between sessions whenever the controller's GATT-DB
#     changes — exactly the friction we hit during early development.
#
# - AutoEnable = true (default)
#     Reconnect known devices when they come back in range. Useful once we
#     have multiple paired apps.

[General]
Class = 0x200420
ControllerMode = le
JustWorksRepairing = always

[Policy]
AutoEnable=true

[GATT]
# Default Cache=always is what we want — see comment in the upstream BlueZ
# example config: "best for interoperability, with more consistent
# reconnection times and enables proper tracking of notifications".

[AdvMon]
# Default RSSI sampling — left unset → 0xFF (one ad per device).
